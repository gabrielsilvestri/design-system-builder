<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Chakra+Petch:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>

<style>
  html,body{margin:0}
  body{background:var(--surface-void);padding:20px;font-family:var(--font-mono)}
  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:420px;margin-bottom:14px}
  .chips{display:grid;grid-template-columns:repeat(6,1fr);gap:9px}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const { Tile, Chip } = window.NorteDesignSystem_23eb33;
  const shield = <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round"><path d="M12 21s7-3.5 7-9V6l-7-3-7 3v6c0 5.5 7 9 7 9z"/></svg>;
  const paw = <svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><ellipse cx="12" cy="15.5" rx="3.4" ry="2.7"/><circle cx="7.3" cy="11.2" r="1.5"/><circle cx="16.7" cy="11.2" r="1.5"/><circle cx="9.7" cy="8" r="1.4"/><circle cx="14.3" cy="8" r="1.4"/></svg>;
  function Demo(){
    return (<>
      <div className="tiles">
        <Tile active icon={shield} name="Reserva de emergência" goal="R$ 10.000" progress={0} sub="guardado R$ 0" />
        <Tile icon={paw} name="Arranhador do pet" goal="R$ 3.000" progress={0} sub="guardado R$ 0" />
      </div>
      <div className="chips">
        <Chip month="jan" value="−2.000" variant="down" />
        <Chip month="fev" value="−1.500" variant="down" />
        <Chip month="mar" value="+3.000" variant="up" />
        <Chip month="abr" value="−1.000" variant="down" />
        <Chip month="mai" value="−2.500" variant="down" />
        <Chip month="jun" value="·····" variant="now" />
      </div>
    </>);
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
</body>
</html>
