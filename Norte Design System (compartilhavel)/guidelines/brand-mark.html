<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}
  body{background:var(--surface-void);font-family:var(--font-mono);color:var(--text-ink);padding:18px;display:flex;align-items:center;gap:20px}
  .hex{width:64px;height:64px;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;font-size:1.9rem;color:var(--text-on-accent);background:linear-gradient(150deg,var(--color-accent),var(--color-accent-2));clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);filter:drop-shadow(0 0 14px var(--glow))}
  .word{font-family:var(--font-display);font-weight:600;letter-spacing:.12em;font-size:1.5rem;color:var(--color-accent);text-shadow:0 0 10px var(--glow)}
  .sub{font-size:var(--p-fs-xs);color:var(--text-faint);margin-top:5px;letter-spacing:.1em}
</style></head>
<body>
  <div class="hex">N</div>
  <div>
    <div class="word">NORTE.SYS</div>
    <div class="sub">家計システム · sistema financeiro do casal</div>
  </div>
</body></html>
