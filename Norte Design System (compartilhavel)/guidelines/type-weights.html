<!-- @dsCard group="Type" viewport="700x150" name="Pesos + tabular" subtitle="400/500/600/700 · numerais de largura fixa alinham colunas" -->
<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}
  body{background:var(--surface-void);font-family:var(--font-mono);color:var(--text-ink);padding:18px;display:flex;gap:28px;align-items:flex-start}
  .col h4{font-family:var(--font-display);font-size:var(--p-fs-2xs);letter-spacing:.12em;text-transform:uppercase;color:var(--color-accent);margin:0 0 8px}
  .w div{font-size:var(--p-fs-md);margin-bottom:3px}
  .tab{font-variant-numeric:tabular-nums;text-align:right}
  .tab div{margin-bottom:3px;color:var(--text-ink)}
  .neg{color:var(--color-attention)} .pos{color:var(--color-positive)}
</style></head>
<body>
  <div class="col w">
    <h4>Pesos</h4>
    <div style="font-weight:400">400 regular · corpo</div>
    <div style="font-weight:500">500 medium · valor de linha</div>
    <div style="font-weight:600">600 semibold · total</div>
    <div style="font-weight:700">700 bold · meta de objetivo</div>
  </div>
  <div class="col">
    <h4>Tabular</h4>
    <div class="tab">
      <div class="neg">−1.500</div>
      <div class="pos">+3.000</div>
      <div class="neg">−2.500</div>
      <div>24.224,84</div>
    </div>
  </div>
</body></html>
