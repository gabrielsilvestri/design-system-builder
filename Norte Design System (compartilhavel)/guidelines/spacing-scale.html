<!-- @dsCard group="Spacing" viewport="700x150" name="Escala de espaço" subtitle="Grade 4/8 — sp-1 (4px) a sp-6 (24px)" -->
<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}
  body{background:var(--surface-void);font-family:var(--font-mono);color:var(--text-ink);padding:18px;display:flex;gap:18px;align-items:flex-end}
  .u{display:flex;flex-direction:column;align-items:center;gap:7px}
  .bar{background:var(--color-accent);box-shadow:0 0 12px var(--glow);width:22px}
  .lab{font-size:var(--p-fs-2xs);color:var(--text-faint);text-align:center}
  .lab b{display:block;color:var(--text-dim);font-weight:600}
</style></head>
<body>
  <div class="u"><div class="bar" style="height:4px"></div><div class="lab"><b>sp-1</b>4</div></div>
  <div class="u"><div class="bar" style="height:8px"></div><div class="lab"><b>sp-2</b>8</div></div>
  <div class="u"><div class="bar" style="height:12px"></div><div class="lab"><b>sp-3</b>12</div></div>
  <div class="u"><div class="bar" style="height:16px"></div><div class="lab"><b>sp-4</b>16</div></div>
  <div class="u"><div class="bar" style="height:20px"></div><div class="lab"><b>sp-5</b>20</div></div>
  <div class="u"><div class="bar" style="height:24px"></div><div class="lab"><b>sp-6</b>24</div></div>
</body></html>
