<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}
  body{background:var(--surface-void);font-family:var(--font-mono);color:var(--text-ink);padding:18px}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .s{border:1px solid var(--surface-line);border-radius:var(--p-r-sm);padding:9px 11px;display:flex;align-items:baseline;gap:9px}
  .jp{font-size:var(--p-fs-lg);color:color-mix(in oklch,var(--color-accent),transparent 25%);letter-spacing:.12em}
  .pt{font-size:var(--p-fs-xs);color:var(--text-faint)}
</style></head>
<body>
  <div class="grid">
    <div class="s"><span class="jp">残高</span><span class="pt">saldo</span></div>
    <div class="s"><span class="jp">支払</span><span class="pt">pagamento</span></div>
    <div class="s"><span class="jp">燃料</span><span class="pt">combustível</span></div>
    <div class="s"><span class="jp">収入</span><span class="pt">receita</span></div>
    <div class="s"><span class="jp">生活費</span><span class="pt">custo de vida</span></div>
    <div class="s"><span class="jp">目標</span><span class="pt">objetivo</span></div>
    <div class="s"><span class="jp">負債</span><span class="pt">dívida</span></div>
    <div class="s"><span class="jp">月次</span><span class="pt">mensal</span></div>
    <div class="s"><span class="jp">家計システム</span><span class="pt">sistema</span></div>
  </div>
</body></html>
