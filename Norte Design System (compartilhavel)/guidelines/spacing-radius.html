<!-- @dsCard group="Spacing" viewport="700x150" name="Raio discreto" subtitle="Cantos quase retos — os brackets de canto fazem o resto" -->
<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}
  body{background:var(--surface-void);font-family:var(--font-mono);color:var(--text-ink);padding:18px;display:flex;gap:22px;align-items:center}
  .box{width:120px;height:74px;background:var(--card-bg);border:1px solid var(--card-border);display:flex;align-items:center;justify-content:center;font-size:var(--p-fs-2xs);color:var(--text-faint);position:relative}
  .box span{position:absolute;width:13px;height:13px;left:-1px;top:-1px;border-top:2px solid var(--color-accent);border-left:2px solid var(--color-accent)}
  .cap{font-size:var(--p-fs-xs);color:var(--text-dim);max-width:300px}
</style></head>
<body>
  <div class="box" style="border-radius:var(--p-r-sm)"><span></span>--p-r-sm · 2px</div>
  <div class="box" style="border-radius:var(--p-r-md)"><span></span>--p-r-md · 3px</div>
  <div class="cap">O raio é mínimo de propósito. A leitura de "moldura" vem dos brackets luminosos de canto, não de cantos arredondados.</div>
</body></html>
