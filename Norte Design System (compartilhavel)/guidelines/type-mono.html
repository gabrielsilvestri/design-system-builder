<!-- @dsCard group="Type" viewport="700x160" name="Mono · IBM Plex Mono" subtitle="Corpo e TODOS os valores — tabular, sem glow" -->
<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}
  body{background:var(--surface-void);font-family:var(--font-mono);color:var(--text-ink);padding:18px}
  .val{font-variant-numeric:tabular-nums;font-size:var(--p-fs-2xl);font-weight:600;letter-spacing:-.02em;line-height:1;color:var(--color-positive);text-shadow:var(--value-glow)}
  .val small{font-size:.4em;color:var(--text-faint);font-weight:500}
  .val i{font-size:.46em;color:var(--text-faint);font-style:normal}
  .body{font-size:var(--p-fs-base);color:var(--text-dim);margin-top:12px}
  .cap{font-size:var(--p-fs-sm);color:var(--text-faint);margin-top:6px}
</style></head>
<body>
  <div class="val"><small>R$ </small>24.224<i>,84</i></div>
  <div class="body">corpo 1rem (piso de leitura) · 0123456789 tabular</div>
  <div class="cap">secundário .78rem · venc 10/07 · fech 30/06 — valores sempre em mono, sem glow nos dígitos</div>
</body></html>
