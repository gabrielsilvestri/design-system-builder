<!-- @dsCard group="Brand" viewport="700x170" name="Textura de superfície" subtitle="Scanline CRT + grade de telemetria + radiais de canto" -->
<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}
  body{margin:0;font-family:var(--font-mono);color:var(--text-ink);
    background:
      repeating-linear-gradient(0deg, oklch(0.07 0.02 268 / .5) 0 1px, transparent 1px 3px),
      linear-gradient(0deg, var(--surface-grid) 0 1px, transparent 1px 48px),
      linear-gradient(90deg, var(--surface-grid) 0 1px, transparent 1px 48px),
      radial-gradient(90% 60% at 78% -10%, color-mix(in oklch,var(--color-accent),transparent 55%), transparent 60%),
      radial-gradient(70% 50% at 8% 110%, color-mix(in oklch,var(--color-accent-2),transparent 65%), transparent 60%),
      var(--surface-void);
    padding:20px;min-height:130px;box-sizing:border-box;display:flex;align-items:flex-end}
  .cap{font-size:var(--p-fs-xs);color:var(--text-dim);max-width:360px}
  .cap b{color:var(--color-accent);font-family:var(--font-display)}
</style></head>
<body>
  <div class="cap"><b>.nt-surface</b> — seis camadas: scanline CRT sutil, grade vertical + horizontal de 48px, radial azul no topo-direito, radial violeta no rodapé-esquerdo, sobre o void. É a "wired" do casal.</div>
</body></html>
